<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مسف خضر | میری تحریری دنیا</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:
    Georgia,
    "Noto Nastaliq Urdu",
    serif;

    background:
    linear-gradient(
        rgba(22,16,13,.94),
        rgba(22,16,13,.98)
    );

    color:#fff;

    min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

header{

    text-align:center;

    padding:35px 15px 30px;

}


/* =====================================================
   LOGO
===================================================== */

.logo-box{

    width:300px;

    max-width:90%;

    margin:0 auto 25px;

    background:#000;

    padding:7px;

    border-radius:20px;

    border:1px solid rgba(224,174,101,.45);

    box-shadow:
    0 15px 45px rgba(0,0,0,.65);

}


.logo-box img{

    width:100%;

    height:auto;

    display:block;

    border-radius:14px;

}


/* =====================================================
   AUTHOR NAME
===================================================== */

.author-name{

    margin:0;

    font-size:38px;

    font-weight:normal;

    color:#f0bd7c;

}


.subtitle{

    margin-top:10px;

    font-size:18px;

    color:#d6c5b9;

}


/* =====================================================
   SECTIONS
===================================================== */

section{

    width:92%;

    max-width:850px;

    margin:35px auto;

}


.section-title{

    text-align:center;

    font-size:31px;

    color:#e7ad70;

    margin:0 0 25px;

}


/* =====================================================
   CARD
===================================================== */

.card{

    background:
    rgba(48,35,28,.88);

    border:
    1px solid rgba(210,160,110,.25);

    border-radius:22px;

    padding:30px;

    box-shadow:
    0 12px 40px rgba(0,0,0,.35);

}


/* =====================================================
   AUTHOR INTRO
===================================================== */

.author-text{

    color:#eee;

    font-size:18px
